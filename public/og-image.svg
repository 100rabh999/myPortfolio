  <text x="128" y="122" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="15" font-weight="600" letter-spacing="1.2">&gt;_ SENIOR SOFTWARE ENGINEER · FULL-STACK · AI</text>

